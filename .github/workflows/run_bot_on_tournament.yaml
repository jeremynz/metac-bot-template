# Runs the bot on the live tournament every 20 minutes; can also be dispatched
# manually against the bot-testing-area questions via the `mode` input.
name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to forecast on"
        type: choice
        options:
          - tournament
          - test_questions
        default: tournament
      max_questions:
        description: "Max questions to forecast (0 = unlimited)"
        type: string
        default: "0"
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    timeout-minutes: 30
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Installs exactly poetry.lock (no re-resolve); forecasting-tools updates arrive as deliberate lock-bump PRs
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode "$MODE" --max-questions "$MAX_QUESTIONS"
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          MODE: ${{ inputs.mode || 'tournament' }}
          MAX_QUESTIONS: ${{ inputs.max_questions || '0' }}
          METACULUS_TOURNAMENT_ID: ${{ vars.METACULUS_TOURNAMENT_ID || '33121' }} # Fall 2026 FutureEval; change per season
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
