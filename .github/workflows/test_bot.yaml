# Runs the test suite on every pull request and on pushes to main; no secrets needed.
name: Test Bot

on:
  pull_request:
  push:
    branches:
      - main

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Fleet runner HOME=/tmp is a 256 MB tmpfs: keep caches/venv in the workspace, skip pip cache.
    env:
      TZ: UTC # fleet runner system tz resolves to an absolute path that pendulum/zoneinfo reject
      PIP_NO_CACHE_DIR: "1"
      POETRY_CACHE_DIR: ${{ github.workspace }}/.poetry-cache
      POETRY_VIRTUALENVS_PATH: ${{ github.workspace }}/.poetry-venvs
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        id: install-poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        id: install-dependencies
        if: ${{ !cancelled() }}
        run: poetry install --no-interaction --no-root
      - name: Run tests
        id: run-tests
        if: ${{ !cancelled() }}
        run: poetry run pytest

      - name: Summary
        if: ${{ !cancelled() }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          rows = ["| step | result |", "|---|---|"]
          bad = False
          for k, v in json.loads(os.environ["STEPS_JSON"]).items():
              c = v.get("conclusion") or "skipped"
              bad |= c == "failure"
              rows.append(f"| {k} | {c} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(rows) + "\n")
          sys.exit(1 if bad else 0)
          PY
